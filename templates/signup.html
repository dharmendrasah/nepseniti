
{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto">

    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 shadow-2xl">

        <h1 class="text-4xl font-bold mb-2">
            Create Account
        </h1>

        <p class="text-gray-400 mb-8">
            Start tracking your NEPSE portfolio today
        </p>

        <form method="POST" class="space-y-6">

            <div>

                <label class="block mb-2 text-gray-300">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500"
                >

            </div>

            <div>

                <label class="block mb-2 text-gray-300">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500"
                >

            </div>

            <div>

                <label class="block mb-2 text-gray-300">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500"
                >

            </div>

            <button
                type="submit"
                class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-semibold text-lg"
            >

                Create Account

            </button>

        </form>

        <p class="mt-6 text-center text-gray-400">

            Already have an account?

            <a href="/login" class="text-red-500 hover:text-red-400">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
